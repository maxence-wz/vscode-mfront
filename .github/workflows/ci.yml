name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Grammar regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # Deliberately `npm install` and no committed lock file: this repo ships
      # no runtime JavaScript, so the point is to check the grammar against the
      # current toolchain rather than against a pinned snapshot.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  package:
    name: Package .vsix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Package extension
        run: npx --yes @vscode/vsce package --out vscode-mfront-syntax.vsix

      - name: Upload .vsix as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: vscode-mfront-syntax-vsix
          path: vscode-mfront-syntax.vsix
